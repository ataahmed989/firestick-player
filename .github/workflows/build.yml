name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds made outside GitHub reached 1.0.70 while this was at 63: numbered past them, so every
      # release here installs over what the TVs have
      - name: Build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FirePlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FirePlayer-${{ env.BUILD_NUMBER }}
          path: FirePlayer.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          name: FirePlayer 1.0.${{ env.BUILD_NUMBER }}
          files: FirePlayer.apk
          make_latest: true
