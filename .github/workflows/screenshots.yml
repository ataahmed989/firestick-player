name: Screenshots

# Runs the app on an Android TV emulator and saves a screenshot of each screen.
# Push a commit to the "shots" branch to run it; nothing is published.
on:
  push:
    branches: [shots]

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Older than the latest release, so the launch-time update offer shows up too.
      BUILD_NUMBER: 11
      EXTRA_ABIS: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FirePlayer.apk
      - name: Make a test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash .github/scripts/make-test-video.sh
      - name: Serve the test video
        # The emulator reaches this machine at 10.0.2.2.
        run: cd media && nohup python3 -m http.server 8000 > /tmp/http.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        # The emulator sometimes hangs while shutting down after the screenshots are taken.
        timeout-minutes: 15
        continue-on-error: true
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: Save the screenshots to the shots-out branch
        if: always()
        run: |
          cd shots
          git init -q -b shots-out
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots-out
